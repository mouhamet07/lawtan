<nav>
  <ul class="pagination pagination-sm justify-content-center mb-0">
    <li class="page-item" [class.disabled]="desactivePrecedent()">
      <a class="page-link" (click)="onPaginate(response!.currentPage - 1)" style="cursor: pointer;">Précédent</a>
    </li>

    @for (page of response?.pages; track page) {
      <li class="page-item" [class.active]="response?.currentPage === page">
        <a class="page-link" (click)="onPaginate(page)" style="cursor: pointer;">{{ page }}</a>
      </li>
    }

    <li class="page-item" [class.disabled]="desactiveSuivant()">
      <a class="page-link" (click)="onPaginate(response!.currentPage + 1)" style="cursor: pointer;">Suivant</a>
    </li>
  </ul>
</nav>
